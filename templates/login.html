<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logowanie | Planer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="auth-brand" href="{{ url_for('login') }}"><span class="brand-mark">✓</span> Planer<span class="brand-dot">.</span></a>
        <p class="eyebrow">Twoja przestrzeń pracy</p>
        <h1>Witaj ponownie</h1>
        <p class="auth-subtitle">Zaloguj się, aby wrócić do swoich planów.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}
        {% endwith %}
        <form method="POST" class="auth-form">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <label>Login<input type="text" name="username" autocomplete="username" required autofocus></label>
            <label>Hasło<input type="password" name="password" autocomplete="current-password" required></label>
            <button class="primary-button" type="submit">Zaloguj się <span>→</span></button>
        </form>
        <p class="auth-footer">Nie masz jeszcze konta? <a href="{{ url_for('register') }}">Załóż je</a></p>
    </main>
</body>
</html>
